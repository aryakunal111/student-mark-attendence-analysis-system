<!DOCTYPE html>
<html>
<head>
<title>Login Portal</title>
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(
135deg,
#050816,
#0a0f2c,
#111827,
#1e293b
);
position:relative;
}

/* Animated glowing circles */
body::before{
content:"";
position:absolute;
width:400px;
height:400px;
background:radial-gradient(circle,#00f7ff,#007bff);
border-radius:50%;
top:-100px;
left:-100px;
filter:blur(120px);
animation:move1 8s infinite alternate;
}

body::after{
content:"";
position:absolute;
width:450px;
height:450px;
background:radial-gradient(circle,#ff00cc,#3333ff);
border-radius:50%;
bottom:-120px;
right:-120px;
filter:blur(150px);
animation:move2 10s infinite alternate;
}

.glow{
position:absolute;
width:250px;
height:250px;
background:radial-gradient(circle,#00ff99,#00c6ff);
border-radius:50%;
filter:blur(100px);
top:40%;
left:60%;
animation:floatGlow 6s infinite alternate;
}

@keyframes move1{
from{transform:translate(0,0);}
to{transform:translate(100px,80px);}
}

@keyframes move2{
from{transform:translate(0,0);}
to{transform:translate(-120px,-80px);}
}

@keyframes floatGlow{
from{transform:translateY(0px);}
to{transform:translateY(-60px);}
}

#particles-js{
position:absolute;
width:100%;
height:100%;
z-index:1;
}

.box{
width:420px;
padding:40px;
text-align:center;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(20px);
border-radius:25px;
position:relative;
z-index:2;
box-shadow:
0 0 30px rgba(0,255,255,0.3),
0 0 60px rgba(0,123,255,0.2);
}

.logo{
width:100px;
height:100px;
border-radius:50%;
margin-bottom:20px;
box-shadow:0 0 20px cyan;
}

h1{
color:white;
margin-bottom:25px;
font-size:38px;
line-height:1.3;
}

button{
width:100%;
padding:15px;
margin:12px 0;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#00c6ff,#0072ff);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00c6ff;
}
</style>
</head>

<body>

<div id="particles-js"></div>
<div class="glow"></div>

<div class="box">
<img src="image/logo.png" class="logo">

<h1>Student Marks Analysis System</h1>

<button onclick="location.href='student-login.html'">
🎓 Student Login
</button>

<button onclick="location.href='hod-login.html'">
👨‍🏫 HOD Login
</button>

</div>

<script>
particlesJS("particles-js", {
particles:{
number:{value:70},
size:{value:3},
move:{speed:2},
line_linked:{enable:true}
}
});
</script>

</body>
</html>
